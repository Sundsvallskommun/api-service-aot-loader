components:
  schemas:
    Status:
      type: string
      description: Status model
      enum:
      - ACTIVE
      - DRAFT
      - EXPIRED
      - BLOCKED
      - TEMPORARY
      - REPLACED
    Problem:
      type: object
      properties:
        instance:
          type: string
          format: uri
        type:
          type: string
          format: uri
        title:
          type: string
        detail:
          type: string
        status:
          type: integer
          format: int32
    ConstraintViolationProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        violations:
          type: array
          items:
            $ref: "#/components/schemas/Violation"
        title:
          type: string
        instance:
          type: string
          format: uri
        causeAsProblem:
          $ref: "#/components/schemas/ThrowableProblem"
        detail:
          type: string
    ThrowableProblem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        causeAsProblem:
          $ref: "#/components/schemas/ThrowableProblem"
    Violation:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    AssetCreateRequest:
      type: object
      properties:
        assetId:
          type: string
          description: External asset id (e.g. PRH-123456789) used as an identifier
            by external systems
          examples:
          - PRH-123456789
        origin:
          type: string
          description: Source of origin for the asset
          examples:
          - CASEDATA
        partyId:
          type: string
          description: PartyId
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
        type:
          type: string
          description: Asset type
          examples:
          - PERMIT
          minLength: 1
        issued:
          type: string
          format: date
          description: Issued date
          examples:
          - 2021-01-01
        validTo:
          type: string
          format: date
          description: Valid to date
          examples:
          - 2021-12-31
        status:
          $ref: "#/components/schemas/Status"
          description: Asset status
          examples:
          - ACTIVE
        statusReason:
          type: string
          description: Status reason
          examples:
          - Status reason
        description:
          type: string
          description: Asset description
          examples:
          - Asset description
        title:
          type: string
          description: "Asset title, shown to the party"
          examples:
          - Stadigvarande tillstånd för servering av alkohol
          maxLength: 255
          minLength: 0
        additionalParameters:
          type: object
          additionalProperties:
            type: string
          description: Additional parameters
          examples:
          - foo: bar
        jsonParameters:
          type: array
          description: JSON parameters
          items:
            $ref: "#/components/schemas/AssetJsonParameter"
      required:
      - issued
      - partyId
      - status
      - type
    AssetJsonParameter:
      type: object
      properties:
        key:
          type: string
          description: Parameter key
          examples:
          - personParameter
          minLength: 1
        value:
          $ref: "#/components/schemas/JsonNode"
          description: Parameter value with the JSON structure
          example:
            firstName: Joe
            lastName: Doe
        schemaId:
          type: string
          description: Schema ID
          examples:
          - person_1.0
          minLength: 1
      required:
      - key
      - schemaId
      - value
    JsonNode:
      type: object
      properties:
        empty:
          type: boolean
        array:
          type: boolean
        "null":
          type: boolean
        object:
          type: boolean
        float:
          type: boolean
        container:
          type: boolean
        long:
          type: boolean
        boolean:
          type: boolean
        int:
          type: boolean
        binary:
          type: boolean
        string:
          type: boolean
        double:
          type: boolean
        pojo:
          type: boolean
        short:
          type: boolean
        textual:
          type: boolean
          deprecated: true
        bigInteger:
          type: boolean
        integralNumber:
          type: boolean
        floatingPointNumber:
          type: boolean
        missingNode:
          type: boolean
        nodeType:
          type: string
          enum:
          - ARRAY
          - BINARY
          - BOOLEAN
          - MISSING
          - "NULL"
          - NUMBER
          - OBJECT
          - POJO
          - STRING
        valueNode:
          type: boolean
        bigDecimal:
          type: boolean
        number:
          type: boolean
        embeddedValue:
          type: boolean
    AssetUpdateRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/Status"
          description: Asset status
          examples:
          - ACTIVE
        statusReason:
          type: string
          description: Status reason
          examples:
          - Status reason
    AssetAttachmentUpdateRequest:
      type: object
      description: Attachment update request. Null values are left untouched
      properties:
        fileName:
          type: string
          description: Name of the file
          examples:
          - lokalritning.pdf
          maxLength: 255
          minLength: 0
        category:
          type: string
          description: What the attachment depicts
          examples:
          - LOKALRITNING
          maxLength: 255
          minLength: 0
        description:
          type: string
          description: Attachment description
          examples:
          - "Ritning over serveringslokal, plan 2"
          maxLength: 255
          minLength: 0
    AssetAttachment:
      type: object
      description: Metadata for a file attached to an asset
      properties:
        id:
          type: string
          description: Unique id of attachment
          examples:
          - 1c8f38a6-b492-4037-b7dc-de5bc6c629f0
          readOnly: true
        fileName:
          type: string
          description: Name of the file
          examples:
          - lokalritning.pdf
        mimeType:
          type: string
          description: Mime type of the file
          examples:
          - application/pdf
          readOnly: true
        fileSize:
          type: integer
          format: int32
          description: Size of the file in bytes
          examples:
          - 1024
          readOnly: true
        category:
          type: string
          description: What the attachment depicts
          examples:
          - LOKALRITNING
        description:
          type: string
          description: Attachment description
          examples:
          - "Ritning over serveringslokal, plan 2"
        created:
          type: string
          format: date-time
          description: Timestamp when the attachment was created
          examples:
          - 2023-01-01T12:00:00+01:00
          readOnly: true
        updated:
          type: string
          format: date-time
          description: Timestamp when the attachment was last updated
          examples:
          - 2023-01-02T12:00:00+01:00
          readOnly: true
    DraftAssetUpdateRequest:
      type: object
      properties:
        issued:
          type: string
          format: date
          description: Issued date
          examples:
          - 2021-01-01
        validTo:
          type: string
          format: date
          description: Valid to date
          examples:
          - 2021-12-31
        indefinitely:
          type: boolean
          description: "If true, validTo will be cleared (asset becomes indefinite).\
            \ Takes precedence over validTo when both are supplied."
          examples:
          - true
        status:
          $ref: "#/components/schemas/Status"
          description: Asset status
          examples:
          - ACTIVE
        statusReason:
          type: string
          description: Status reason
          examples:
          - Status reason
        title:
          type: string
          description: "Asset title, shown to the party"
          examples:
          - Stadigvarande tillstånd för servering av alkohol
          maxLength: 255
          minLength: 0
        additionalParameters:
          type: object
          additionalProperties:
            type: string
          description: Additional parameters
          examples:
          - foo: bar
        jsonParameters:
          type: array
          description: JSON parameters
          items:
            $ref: "#/components/schemas/AssetJsonParameter"
    Asset:
      type: object
      properties:
        id:
          type: string
          description: Unique id of asset
          examples:
          - 1c8f38a6-b492-4037-b7dc-de5bc6c629f0
        assetId:
          type: string
          description: External asset id (e.g. PRH-123456789) used as an identifier
            by external systems
          examples:
          - PRH-123456789
        origin:
          type: string
          description: Source of origin for the asset
          examples:
          - CASEDATA
        partyId:
          type: string
          description: PartyId
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
        type:
          type: string
          description: Asset type
          examples:
          - PERMIT
        issued:
          type: string
          format: date
          description: Issued date
          examples:
          - 2021-01-01
        validTo:
          type: string
          format: date
          description: Valid to date
          examples:
          - 2021-12-31
        status:
          $ref: "#/components/schemas/Status"
          description: Asset status
          examples:
          - ACTIVE
        statusReason:
          type: string
          description: Status reason
          examples:
          - Status reason
        description:
          type: string
          description: Asset description
          examples:
          - Asset description
        title:
          type: string
          description: "Asset title, shown to the party"
          examples:
          - Stadigvarande tillstånd för servering av alkohol
        additionalParameters:
          type: object
          additionalProperties:
            type: string
          description: Additional parameters
          examples:
          - foo: bar
        jsonParameters:
          type: array
          description: JSON parameters
          items:
            $ref: "#/components/schemas/AssetJsonParameter"
        replacesId:
          type: string
          description: Id of the asset this asset replaces
          examples:
          - 1c8f38a6-b492-4037-b7dc-de5bc6c629f0
    AssetRevision:
      type: object
      description: An asset as it looked at one point in its history. The newest revision
        is the asset as it is now
      properties:
        id:
          type: string
          description: Unique id of the asset this revision belongs to
          examples:
          - 1c8f38a6-b492-4037-b7dc-de5bc6c629f0
          readOnly: true
        revision:
          type: integer
          format: int32
          description: "Revision number. Numbering starts at 0, which is the asset\
            \ as it was created, and increases by one for every recorded change"
          examples:
          - 2
          readOnly: true
        actor:
          type: string
          description: "Who created this revision, taken from the X-Sent-By header.\
            \ Null when the header was absent, and for revisions written by the nightly\
            \ expiration job"
          examples:
          - joe01doe
          readOnly: true
        recordedAt:
          type: string
          format: date-time
          description: "When this revision was superseded, or when the asset was last\
            \ changed for the current revision"
          examples:
          - 2023-01-02T12:00:00+01:00
          readOnly: true
        assetId:
          type: string
          description: External asset id (e.g. PRH-123456789) used as an identifier
            by external systems
          examples:
          - PRH-123456789
          readOnly: true
        origin:
          type: string
          description: Source of origin for the asset
          examples:
          - CASEDATA
          readOnly: true
        partyId:
          type: string
          description: PartyId
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
          readOnly: true
        type:
          type: string
          description: Asset type
          examples:
          - PERMIT
          readOnly: true
        issued:
          type: string
          format: date
          description: Issued date
          examples:
          - 2021-01-01
          readOnly: true
        validTo:
          type: string
          format: date
          description: Valid to date
          examples:
          - 2021-12-31
          readOnly: true
        status:
          $ref: "#/components/schemas/Status"
          description: Asset status
          examples:
          - ACTIVE
          readOnly: true
        statusReason:
          type: string
          description: Status reason
          examples:
          - Status reason
          readOnly: true
        description:
          type: string
          description: Asset description
          examples:
          - Asset description
          readOnly: true
        title:
          type: string
          description: "Asset title, shown to the party"
          examples:
          - Stadigvarande tillstånd för servering av alkohol
          readOnly: true
        additionalParameters:
          type: object
          additionalProperties:
            type: string
          description: Additional parameters
          examples:
          - foo: bar
          readOnly: true
        jsonParameters:
          type: array
          description: JSON parameters
          items:
            $ref: "#/components/schemas/AssetJsonParameter"
          readOnly: true
        replacesId:
          type: string
          description: Id of the asset this asset replaces
          examples:
          - 1c8f38a6-b492-4037-b7dc-de5bc6c629f0
          readOnly: true
        attachments:
          type: array
          description: "Attachment metadata as it was at this revision. The files\
            \ themselves never change, so each one is still downloadable by its id\
            \ even if it has since been removed"
          items:
            $ref: "#/components/schemas/AssetAttachment"
          readOnly: true
  securitySchemes: {}
